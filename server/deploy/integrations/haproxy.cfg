# HAProxy in front of an app, with requests and responses inspected by a Corazium node in SPOA mode:
#   edge-agent --mode spoa --listen :9003 --control-plane ...
#
# Development setup (docker compose --profile integrations): HAProxy listens on 8088, the app and the agent run
# on the host.
global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    bind :8088
    unique-id-format %[uuid()]
    # dev only: the traffic simulator sets X-Forwarded-For; in production drop this and use the real peer.
    http-request set-src hdr(x-forwarded-for)
    filter spoe engine corazium config /usr/local/etc/haproxy/spoe.conf

    # Buffer the body so the WAF sees it, then ask the node. Fails open if the node does not answer.
    http-request wait-for-body time 2s at-least 1m
    http-request send-spoe-group corazium corazium-req-group
    http-request deny deny_status 403 if { var(txn.corazium.action) -m str deny }

    http-response wait-for-body time 2s at-least 1m
    http-response send-spoe-group corazium corazium-res-group
    http-response deny deny_status 403 if { var(txn.corazium.action) -m str deny }

    default_backend app

backend app
    server app host.docker.internal:9000

backend corazium-spoa
    mode tcp
    server node host.docker.internal:9003
