# SPOE contract between HAProxy and a Corazium node in SPOA mode (internal/agent/spoa.go).
[corazium]
spoe-agent corazium-agent
    groups corazium-req-group corazium-res-group
    option var-prefix corazium
    option set-on-error error
    timeout hello 2s
    timeout idle 2m
    timeout processing 1s
    use-backend corazium-spoa
    log global

spoe-message corazium-req
    args id=unique-id src-ip=src src-port=src_port method=method path=path query=query version=req.ver headers=req.hdrs body=req.body

spoe-message corazium-res
    args id=unique-id version=res.ver status=status headers=res.hdrs body=res.body

spoe-group corazium-req-group
    messages corazium-req

spoe-group corazium-res-group
    messages corazium-res
